[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preventive-risk-engine"
version = "2.1.0"
description = "Preventive Care Patient Risk Scoring Engine (rules-based MVP, wraps NEWS2/Charlson/LACE/Beers/PDC/HEDIS/USPSTF)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["preventive_risk_engine*"]
